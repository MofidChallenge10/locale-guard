[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="locale-guard"
version="0.1.0"
description="Translation catalog consistency checker"
requires-python=">=3.10"
license={text="MIT"}
[project.scripts]
locale-guard="locale_guard:main"
[tool.setuptools]
package-dir={""="src"}
py-modules=["locale_guard"]
